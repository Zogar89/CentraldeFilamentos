name: Publish Thumbnails

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "public/assets/**"
      - "!public/assets/thumbs/**"
      - "centraldefilamentos/material_appearance.py"
      - "centraldefilamentos/material_swatches.py"
      - "centraldefilamentos/data/pantone_srgb.json"
      - "centraldefilamentos/data/material_finish_overrides.json"
      - ".github/workflows/thumbnails.yml"

permissions:
  contents: write

concurrency:
  group: centralde-filamentos-publishing
  cancel-in-progress: false
  queue: max

jobs:
  thumbnails:
    name: Generate and publish thumbnails
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install thumbnail dependencies
        run: python -m pip install -e .

      - name: Generate material swatches
        run: python -m centraldefilamentos.generate_material_swatches --stock-json public/data/stock.json --public-dir public

      - name: Generate thumbnails
        run: python -m centraldefilamentos.generate_thumbnails --stock-json public/data/stock.json

      - name: Commit thumbnails
        run: |
          set -euo pipefail
          git add -- public/assets/material-swatches public/assets/thumbs public/data/stock.json
          if git diff --cached --quiet; then
            echo "No thumbnail changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update thumbnails"
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/master; then
              exit 0
            fi
            [[ "$attempt" == 3 ]] || sleep "$((attempt * 2))"
          done
          exit 1

      - name: Publish assets to gh-pages
        run: python3 .github/scripts/publish_pages.py thumbnails
