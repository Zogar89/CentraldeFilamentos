name: Publish UI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/pages.yml"
      - "src/**"
      - "index.html"
      - "catalogo.html"
      - "resumen.html"
      - "color-picker.html"
      - "estadisticas.html"
      - "public/favicon.svg"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "svelte.config.js"

permissions:
  contents: write

concurrency:
  group: centralde-filamentos-publishing
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Build and publish UI
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Publish dist to gh-pages
        run: python3 .github/scripts/publish_pages.py ui
