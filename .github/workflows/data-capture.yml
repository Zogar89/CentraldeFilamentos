name: Capture Stock Data

on:
  workflow_dispatch:
  schedule:
    # Dias habiles 09, 12, 15 y 18 hs Argentina (UTC-3).
    - cron: "0 12,15,18,21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: centralde-filamentos-publishing
  cancel-in-progress: false
  queue: max

jobs:
  capture:
    name: Capture stock data
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scraper dependencies
        run: python -m pip install -e .

      - name: Build stock data
        run: python -m centraldefilamentos.build_data --output public/data/stock.json

      - name: Commit captured data
        run: |
          set -euo pipefail
          git add -- \
            centraldefilamentos/data/daily_provider_stock_snapshot.json \
            centraldefilamentos/data/provider_stock_history.json \
            centraldefilamentos/data/color_registry.json \
            public/data/build_business_log.json \
            public/data/build_technical_log.json \
            public/data/provider_stock_history.json \
            public/data/stock.json
          if git diff --cached --quiet; then
            echo "No stock data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update stock data"
          for attempt in 1 2 3; do
            if git push origin HEAD:refs/heads/master; then
              exit 0
            fi
            [[ "$attempt" == 3 ]] || sleep "$((attempt * 2))"
          done
          exit 1

      - name: Publish data to gh-pages
        run: python3 .github/scripts/publish_pages.py data
